[project]
name = "ts-analysis"
version = "0.1.0"
description = "Measure how accurate Timestral's forecasts are on US small caps in a big gap."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.scripts]
ts-fetch = "ts_analysis.fetch:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
